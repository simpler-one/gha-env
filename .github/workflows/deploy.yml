name: Deployment
on:
  push:
    branches:
      - master
      - dev
env:
  MONGODB_DB_NAME: gha-table
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    env:
      MONGODB_USERNAME: dhyeyshah0208_db_user
      MONGODB_PASSWORD: bS8XP1onq9pjlGYg
      MONGODB_CLUSTER_ADDRESS: cluster0.gqdt1nq.mongodb.net
      PORT: 3000
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT
      - name: Run tests
        run: npm test
      - name: Output information
        run: 'echo "PORT: ${{env.PORT}}"'
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          'echo "PORT: $PORT"'
          'echo "MONGODB_DB_NAME: ${{env.MONGODB_DB_NAME}}"'